services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sdip-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdip"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sdip
      FRONTEND_DIST_DIR: /app/frontend_dist
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  sdip-data:
