[project]
name = "backend"
version = "0.1.0"
description = "Restaurant Waitlist Manager backend (FastAPI implementation of ../openapi.yaml)"
readme = "README.md"
authors = [
    { name = "Mounir Gmamsi", email = "268368735+Mr-Gms-33@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
